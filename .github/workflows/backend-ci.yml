name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Format, unit tests, PostgreSQL integration tests, and build
        run: ./gradlew check bootJar --no-daemon
      - name: Store verified collector executable
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-collector-${{ github.sha }}
          path: backend/build/libs/*-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

  required-checks:
    if: always()
    needs: [backend]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful backend checks
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: test "$BACKEND_RESULT" = success
