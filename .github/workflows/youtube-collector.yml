name: YouTube Collector

on:
  schedule:
    - cron: '17 1-23/2 * * *'
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      discover:
        description: Also discover new uploads (requires DISCOVERY_ENABLED variable)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: youtube-collector
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main' && vars.COLLECTOR_ENABLED == 'true' && (github.event_name != 'schedule' || vars.COLLECTOR_SCHEDULE_OWNER != 'render')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Find successful main CI build
        id: ci
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'backend-ci.yml', branch: 'main',
              event: 'push', status: 'success', per_page: 1
            });
            const run = result.data.workflow_runs[0];
            if (!run) {
              core.setFailed('No successful main Backend CI build is available.');
              return;
            }
            core.setOutput('sha', run.head_sha);
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              ...context.repo, run_id: run.id
            });
            const artifact = artifacts.data.artifacts.find(a =>
              a.name === `backend-collector-${run.head_sha}` && !a.expired);
            core.setOutput('artifact', artifact ? 'true' : 'false');
            core.setOutput('run-id', run.id);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ci.outputs.sha }}
      - name: Require collector source
        run: test -f backend/src/main/java/com/stelody/collector/CollectorLauncher.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore executable cache
        id: jar-cache
        uses: actions/cache/restore@v4
        with:
          path: collector-artifact
          key: collector-executable-${{ steps.ci.outputs.sha }}
      - name: Download verified executable
        if: steps.ci.outputs.artifact == 'true' && steps.jar-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: backend-collector-${{ steps.ci.outputs.sha }}
          run-id: ${{ steps.ci.outputs.run-id }}
          github-token: ${{ github.token }}
          path: collector-artifact
      - name: Build executable when artifact expired
        if: steps.ci.outputs.artifact != 'true' && steps.jar-cache.outputs.cache-hit != 'true'
        working-directory: backend
        run: |
          ./gradlew bootJar --no-daemon
          mkdir -p ../collector-artifact
          cp build/libs/*-SNAPSHOT.jar ../collector-artifact/
      - name: Cache executable before external collection
        if: steps.jar-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: collector-artifact
          key: collector-executable-${{ steps.ci.outputs.sha }}
      - name: Prepare database TLS certificate
        env:
          COLLECTOR_DB_CA_CERTIFICATE_BASE64: ${{ secrets.COLLECTOR_DB_CA_CERTIFICATE_BASE64 }}
        run: |
          if test -n "$COLLECTOR_DB_CA_CERTIFICATE_BASE64"; then
            umask 077
            ca_file=$(mktemp)
            trap 'rm -f "$ca_file"' EXIT
            printf '%s' "$COLLECTOR_DB_CA_CERTIFICATE_BASE64" | base64 --decode > "$ca_file"
            openssl x509 -in "$ca_file" -noout -checkend 0
            mv -f "$ca_file" /tmp/stelody-collector-db-ca.crt
            trap - EXIT
          fi
      - name: Collect registered videos
        env:
          COLLECTOR_ENABLED: 'true'
          COLLECTOR_DB_URL: ${{ secrets.COLLECTOR_DB_URL }}
          COLLECTOR_DB_USERNAME: ${{ secrets.COLLECTOR_DB_USERNAME }}
          COLLECTOR_DB_PASSWORD: ${{ secrets.COLLECTOR_DB_PASSWORD }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SPRING_PROFILES_ACTIVE: prod
          COLLECTION_RETRY_ENABLED: ${{ vars.COLLECTION_RETRY_ENABLED }}
          DISCOVERY_ENABLED: ${{ vars.DISCOVERY_ENABLED }}
          DISCOVERY_CLASSIFICATION_ALLOWED: ${{ vars.DISCOVERY_CLASSIFICATION_ALLOWED }}
          COVER_AUTO_PUBLICATION_POLICY_ALLOWED: ${{ vars.COVER_AUTO_PUBLICATION_POLICY_ALLOWED }}
          DISCOVER_THIS_RUN: ${{ vars.DISCOVERY_ENABLED == 'true' && (github.event.schedule == '17 */2 * * *' || inputs.discover == true) }}
        run: |
          test -n "$COLLECTOR_DB_URL"
          test -n "$COLLECTOR_DB_USERNAME"
          test -n "$COLLECTOR_DB_PASSWORD"
          test -n "$YOUTUBE_API_KEY"
          if test -d collector-artifact; then
            jar=$(find collector-artifact -name '*.jar' -type f | head -n 1)
          else
            jar=$(find backend/build/libs -name '*.jar' ! -name '*-plain.jar' -type f | head -n 1)
          fi
          test -n "$jar"
          if test "$DISCOVER_THIS_RUN" = true; then
            test -f backend/src/main/java/com/stelody/collector/service/DiscoveryCollector.java
            timeout --signal=TERM 11m java -jar "$jar" --collector --discover
          else
            timeout --signal=TERM 11m java -jar "$jar" --collector
          fi
      - name: Remove database TLS certificate
        if: always()
        run: rm -f /tmp/stelody-collector-db-ca.crt
