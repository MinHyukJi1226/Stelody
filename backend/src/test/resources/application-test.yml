spring:
  session:
    jdbc:
      # Cleanup is exercised explicitly; cached contexts can outlive their test containers.
      cleanup-cron: "-"
  datasource:
    hikari:
      maximum-pool-size: 2

stelody:
  reauthentication:
    cleanup-delay-ms: 86400000
  special-review:
    scan-delay-ms: 86400000
