spring:
  application:
    name: stelody
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
        jdbc.time_zone: UTC
  flyway:
    default-schema: app
    schemas: app,session
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}
    placeholders:
      runtimeRole: ${DB_RUNTIME_ROLE:${spring.datasource.username}}
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: session.SPRING_SESSION
server:
  forward-headers-strategy: none
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        secure: true
        same-site: lax
        path: /
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

stelody:
  collector:
    enabled: ${COLLECTOR_ENABLED:false}
    scheduled-enabled: ${COLLECTOR_SCHEDULED_ENABLED:false}
    db-url: ${COLLECTOR_DB_URL:}
    db-username: ${COLLECTOR_DB_USERNAME:}
    db-password: ${COLLECTOR_DB_PASSWORD:}
    api-key: ${YOUTUBE_API_KEY:}
  withdrawal-journal:
    enabled: ${WITHDRAWAL_JOURNAL_ENABLED:false}
    endpoint: ${WITHDRAWAL_B2_ENDPOINT:}
    bucket: ${WITHDRAWAL_B2_BUCKET:}
    access-key-id: ${WITHDRAWAL_B2_ACCESS_KEY_ID:}
    secret-access-key: ${WITHDRAWAL_B2_SECRET_ACCESS_KEY:}
    recipient: ${WITHDRAWAL_AGE_RECIPIENT:}
    ledger-id: ${WITHDRAWAL_LEDGER_ID:}
    age-binary: ${WITHDRAWAL_AGE_BINARY:/usr/bin/age}
  cover-publication:
    policy-allowed: ${COVER_AUTO_PUBLICATION_POLICY_ALLOWED:false}
  special-review:
    enabled: ${SPECIAL_EVENT_REVIEW_ENABLED:false}
    policy-allowed: ${SPECIAL_EVENT_POLICY_ALLOWED:false}
  collection:
    retry-enabled: ${COLLECTION_RETRY_ENABLED:false}
  export:
    enabled: ${YOUTUBE_EXPORT_ENABLED:false}
    redirect-uri: ${YOUTUBE_EXPORT_REDIRECT_URI:}
  statistics:
    trending-enabled: ${TRENDING_ENABLED:false}
    trending-policy-allowed: ${TRENDING_POLICY_ALLOWED:false}
  playlists:
    limit: ${PLAYLIST_LIMIT:50}
    item-limit: ${PLAYLIST_ITEM_LIMIT:500}
  favorites:
    limit: ${FAVORITE_LIMIT:5000}
  auth:
    google:
      redirect-uri: ${GOOGLE_REDIRECT_URI:}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    disable-swagger-default-url: true
    persist-authorization: false
    supported-submit-methods: [get, post, put, patch, delete]
  paths-to-match: /api/v1/**
  use-fqn: true
  override-with-generic-response: false
  writer-with-order-by-keys: true
