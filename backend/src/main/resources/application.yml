spring:
  application:
    name: stelody
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
        jdbc.time_zone: UTC
  flyway:
    default-schema: app
    schemas: app,session
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}
    placeholders:
      runtimeRole: ${DB_RUNTIME_ROLE:${spring.datasource.username}}
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: session.SPRING_SESSION
server:
  forward-headers-strategy: none
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        secure: true
        same-site: lax
        path: /
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

stelody:
  special-review:
    enabled: ${SPECIAL_EVENT_REVIEW_ENABLED:false}
    policy-allowed: ${SPECIAL_EVENT_POLICY_ALLOWED:false}
  collection:
    retry-enabled: ${COLLECTION_RETRY_ENABLED:false}
  export:
    enabled: ${YOUTUBE_EXPORT_ENABLED:false}
    redirect-uri: ${YOUTUBE_EXPORT_REDIRECT_URI:}
  statistics:
    trending-enabled: ${TRENDING_ENABLED:false}
    trending-policy-allowed: ${TRENDING_POLICY_ALLOWED:false}
  playlists:
    limit: ${PLAYLIST_LIMIT:50}
    item-limit: ${PLAYLIST_ITEM_LIMIT:500}
  favorites:
    limit: ${FAVORITE_LIMIT:5000}
  auth:
    google:
      redirect-uri: ${GOOGLE_REDIRECT_URI:}
