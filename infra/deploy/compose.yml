name: stelody-production
services:
  backend:
    image: ${STELODY_IMAGE:?Set STELODY_IMAGE to the tested release image}
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod,google
      SPRING_CONFIG_IMPORT: file:/run/secrets/web.properties
    secrets:
      - source: web_settings
        target: web.properties
      - source: db_ca
        target: db-ca.crt
    healthcheck:
      test: [CMD, /opt/stelody/healthcheck.sh]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    mem_limit: 1g
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
secrets:
  web_settings:
    file: ${WEB_SETTINGS_FILE:?Set WEB_SETTINGS_FILE to the private absolute properties path}
  db_ca:
    file: ${DB_CA_FILE:?Set DB_CA_FILE to the PostgreSQL CA certificate path}
