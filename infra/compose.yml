services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: stelody
      POSTGRES_USER: stelody
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-only-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stelody -d stelody"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  postgres-data:
